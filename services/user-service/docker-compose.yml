services:

  user-service-postgres:
    image: postgres:17
    container_name: user-service-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - user-service-network


  user-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: monitoring/user-service:0.0.1
    container_name: user-service

    ports:
      - "${USER_SERVICE_PORT}:8283"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}

    depends_on:
      user-service-postgres:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - user-service-network


volumes:
  user_service_postgres_data:


networks:
  user-service-network:
    driver: bridge