apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-service
  namespace: monitoring-platform
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/v1/monitoring
            pathType: Prefix
            backend:
              service:
                name: monitoring-service
                port:
                  number: 8282